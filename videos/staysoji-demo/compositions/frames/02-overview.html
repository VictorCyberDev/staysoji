<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Geist";
          src: url("assets/fonts/geist-sans.woff2") format("woff2");
          font-weight: 100 900;
          font-display: block;
        }
        @font-face {
          font-family: "Geist Mono";
          src: url("assets/fonts/geist-mono.woff2") format("woff2");
          font-weight: 100 900;
          font-display: block;
        }
        #root {
          position: relative;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #f3efe6;
          font-family: "Geist", system-ui, sans-serif;
        }
        .stage-wrap {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .stage {
          position: relative;
          width: 72%;
          aspect-ratio: 860 / 1864;
          opacity: 0;
        }
        .stage img {
          width: 100%;
          height: 100%;
          display: block;
          border-radius: 20px;
          box-shadow: 0 24px 60px -30px rgba(20, 30, 30, 0.35);
        }
        .box {
          position: absolute;
          left: 3%;
          width: 94%;
          border: 3px solid #c9a24b;
          border-radius: 14px;
          opacity: 0;
          transform: scale(0.97);
        }
        .box-1 {
          top: 63.6%;
          height: 10.2%;
        }
        .box-2 {
          top: 73.8%;
          height: 10.2%;
        }
        .box-3 {
          top: 84.0%;
          height: 10.1%;
        }
        .index-pill {
          position: absolute;
          font-family: "Geist Mono", monospace;
          font-weight: 500;
          font-size: 28px;
          letter-spacing: 0.04em;
          color: #0a1618;
          background: #dab868;
          border-radius: 999px;
          padding: 8px 20px;
          opacity: 0;
          left: -6%;
          transform: translateX(-100%) scale(0.9);
        }
        .index-1 {
          top: 65.6%;
        }
        .index-2 {
          top: 75.8%;
        }
        .index-3 {
          top: 86.0%;
        }
      </style>

      <div id="root" data-composition-id="02-overview" data-width="1080" data-height="1920" data-duration="7">
        <div class="stage-wrap">
          <div class="stage" id="stage">
            <img src="assets/landing.png" alt="" />
            <div class="box box-1" id="box1"></div>
            <div class="box box-2" id="box2"></div>
            <div class="box box-3" id="box3"></div>
            <div class="index-pill index-1" id="pill1">1</div>
            <div class="index-pill index-2" id="pill2">2</div>
            <div class="index-pill index-3" id="pill3">3</div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-0.8s): the real landing page slides up into frame.
        tl.fromTo("#stage", { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0);

        // Scene 2 (0.9-2.1s): highlight row 1 - the calculator.
        tl.to("#box1", { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 0.9);
        tl.to("#pill1", { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 1.0);
        tl.to("#box1", { borderColor: "rgba(201,162,75,0.3)", duration: 0.3 }, 2.0);

        // Scene 3 (2.3-3.5s): highlight row 2 - the lookup.
        tl.to("#box2", { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 2.3);
        tl.to("#pill2", { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 2.4);
        tl.to("#box2", { borderColor: "rgba(201,162,75,0.3)", duration: 0.3 }, 3.4);

        // Scene 4 (3.7-4.9s): highlight row 3 - the scanner.
        tl.to("#box3", { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 3.7);
        tl.to("#pill3", { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 3.8);

        // Scene 5 (4.9-6.5s): held read, all three rows lit.
        tl.to(["#box1", "#box2", "#box3"], { borderColor: "#dab868", duration: 0.2, yoyo: true, repeat: 1 }, 5.2);

        window.__timelines["02-overview"] = tl;
      </script>
    </template>
  </body>
</html>
