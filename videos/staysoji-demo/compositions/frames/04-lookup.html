<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Geist";
          src: url("assets/fonts/geist-sans.woff2") format("woff2");
          font-weight: 100 900;
          font-display: block;
        }
        @font-face {
          font-family: "Geist Mono";
          src: url("assets/fonts/geist-mono.woff2") format("woff2");
          font-weight: 100 900;
          font-display: block;
        }
        #root {
          position: relative;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #0a1618;
          font-family: "Geist", system-ui, sans-serif;
        }
        .eyebrow {
          position: absolute;
          top: 5%;
          left: 0;
          right: 0;
          text-align: center;
          font-family: "Geist Mono", monospace;
          font-size: 26px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: #dab868;
          opacity: 0;
        }
        .stage-wrap {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .stage {
          position: relative;
          width: 68%;
          aspect-ratio: 860 / 1864;
        }
        .layer {
          position: absolute;
          inset: 0;
          opacity: 0;
        }
        .layer img {
          width: 100%;
          height: 100%;
          display: block;
          border-radius: 20px;
          box-shadow: 0 24px 60px -30px rgba(20, 30, 30, 0.4);
        }
        .box {
          position: absolute;
          border: 3px solid #c9a24b;
          border-radius: 12px;
          opacity: 0;
          transform: scale(0.96);
        }
        .box-search {
          left: 3%;
          width: 94%;
          top: 29.6%;
          height: 7.7%;
        }
        .box-suggestions {
          left: 3%;
          width: 94%;
          top: 39.2%;
          height: 22.5%;
        }
        .box-badge {
          left: 10%;
          width: 26%;
          top: 33.6%;
          height: 3.2%;
          border-radius: 999px;
        }
        .box-reason {
          left: 10%;
          width: 80%;
          top: 45.5%;
          height: 12.5%;
        }
        .box-sources {
          left: 3%;
          width: 94%;
          top: 84.5%;
          height: 14%;
        }
      </style>

      <div id="root" data-composition-id="04-lookup" data-width="1080" data-height="1920" data-duration="9">
        <div class="eyebrow" id="eyebrow">2 &middot; Loan App Lookup</div>
        <div class="stage-wrap">
          <div class="stage" id="stage">
            <div class="layer" id="layer-input">
              <img src="assets/lookup-typing.png" alt="" />
              <div class="box box-search" id="box-search"></div>
              <div class="box box-suggestions" id="box-suggestions"></div>
            </div>
            <div class="layer" id="layer-result">
              <img src="assets/lookup-result.png" alt="" />
              <div class="box box-badge" id="box-badge"></div>
              <div class="box box-reason" id="box-reason"></div>
              <div class="box box-sources" id="box-sources"></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-0.3s): eyebrow.
        tl.to("#eyebrow", { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.1);

        // Scene 2 (0.3-1.1s): input state - a name typed into the search field.
        tl.fromTo("#stage", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.3);
        tl.to("#layer-input", { opacity: 1, duration: 0.01 }, 0.3);

        // Scene 3 (1.2-2.6s): highlight the search box, then the live suggestions.
        tl.to("#box-search", { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 1.2);
        tl.to("#box-search", { opacity: 0.35, duration: 0.25 }, 1.9);
        tl.to("#box-suggestions", { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 1.9);
        tl.to(["#box-search", "#box-suggestions"], { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 3.0);

        // Scene 4 (3.2-3.8s): crossfade to the result screen.
        tl.to("#layer-input", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 3.2);
        tl.to("#layer-result", { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 3.2);

        // Scene 5 (4.0-4.6s): HIGH RISK badge.
        tl.fromTo("#box-badge", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 4.0);

        // Scene 6 (4.7-5.6s): the cited reasoning.
        tl.fromTo("#box-reason", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 4.7);
        tl.to("#box-reason", { opacity: 0.4, duration: 0.3 }, 6.0);

        // Scene 7 (6.2-7.0s): the cited sources block, proving it's not invented.
        tl.fromTo("#box-sources", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 6.2);

        // Scene 8 (7.0-8.5s): held read.

        window.__timelines["04-lookup"] = tl;
      </script>
    </template>
  </body>
</html>
