<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="45.5"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-overview"
        class="scene"
        data-composition-id="02-overview"
        data-composition-src="compositions/frames/02-overview.html"
        data-start="4"
        data-duration="7"
        data-track-index="1"
      ></div>

      <div
        id="el-03-calculator"
        class="scene"
        data-composition-id="03-calculator"
        data-composition-src="compositions/frames/03-calculator.html"
        data-start="10.5"
        data-duration="12"
        data-track-index="0"
      ></div>

      <div
        id="el-04-lookup"
        class="scene"
        data-composition-id="04-lookup"
        data-composition-src="compositions/frames/04-lookup.html"
        data-start="22"
        data-duration="9"
        data-track-index="1"
      ></div>

      <div
        id="el-05-scan"
        class="scene"
        data-composition-id="05-scan"
        data-composition-src="compositions/frames/05-scan.html"
        data-start="30.5"
        data-duration="9"
        data-track-index="0"
      ></div>

      <div
        id="el-06-close"
        class="scene"
        data-composition-id="06-close"
        data-composition-src="compositions/frames/06-close.html"
        data-start="39"
        data-duration="6.5"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-overview", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.to("#el-02-overview", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 10.5);
        tl.fromTo("#el-03-calculator", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 10.5);
        tl.to("#el-03-calculator", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 22);
        tl.fromTo("#el-04-lookup", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 22);
        tl.to("#el-04-lookup", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 30.5);
        tl.fromTo("#el-05-scan", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 30.5);
        tl.to("#el-05-scan", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 39);
        tl.fromTo("#el-06-close", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 39);
        tl.to({}, { duration: 45.5 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
